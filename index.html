<style>
body{margin:0;background:#07090C}
a{color:#8CCBF0}a:hover{color:#BFE3F8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}

/* ===== LOADER ===== */
@keyframes lLetter{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:none}}
@keyframes lLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lSub{from{opacity:0;letter-spacing:.8em}to{opacity:1;letter-spacing:.35em}}

.word{display:inline-block;transform-origin:50% 100%;animation:word 1s cubic-bezier(.16,1,.3,1) both}
.fadeUp{animation:fadeUp 1s cubic-bezier(.16,1,.3,1) both}

/* ===== LOOPS ===== */
@keyframes ticker{0%,20%{transform:translateY(0)}25%,45%{transform:translateY(-25%)}50%,70%{transform:translateY(-50%)}75%,95%{transform:translateY(-75%)}100%{transform:translateY(0)}}

@keyframes ripple{0%{opacity:.45;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
@keyframes check{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.stamp{animation:stamp .9s cubic-bezier(.2,.9,.3,1.2) both}
.shock{animation:shock 1s cubic-bezier(.16,1,.3,1) both}
.ripple{animation:ripple 3s ease-out infinite}
.shake{animation:shake .5s ease-out .5s both}
.burst{animation:burst 1.1s cubic-bezier(.16,1,.3,1) .5s both}

.ringText{animation:fadeIn 1s ease 1.2s both}
.ringSpin{animation:spin 24s linear infinite}

/* ===== KARTE ===== */

@keyframes cityPing{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}

.cityPing{transform-box:fill-box;transform-origin:center;animation:cityPing 2.4s ease-out infinite}
.popIn{transform-box:fill-box;transform-origin:center;animation:popIn .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes countPop{0%{transform:translateY(30%);opacity:.2}100%{transform:none;opacity:1}}

/* ===== SCROLL-DRIVEN ===== */

@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes zoomThrough{0%{transform:scale(1);opacity:1}70%{opacity:1}100%{transform:scale(26);opacity:0}}
@keyframes behindIn{0%,35%{opacity:0;transform:scale(1.3)}100%{opacity:1;transform:none}}

@keyframes circleOpen{from{clip-path:circle(6% at 50% 50%)}to{clip-path:circle(75% at 50% 50%)}}

@keyframes lit{from{color:#262C34}to{color:#EEF2F5}}

@keyframes drawLine{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes stepPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes phoneSpin{from{transform:rotateY(32deg) rotateX(8deg) rotateZ(-8deg)}to{transform:rotateY(-22deg) rotateX(-4deg) rotateZ(5deg)}}
.line{stroke-dasharray:1000}

@supports (animation-timeline: view()){
  .progress{animation:grow linear both;animation-timeline:scroll(root)}
  .reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
  .wipe{animation:wipe linear both;animation-timeline:view();animation-range:entry 10% cover 40%}
  .flip3d{animation:flip3d linear both;animation-timeline:view();animation-range:entry 0% cover 35%}
  .lit{animation:lit linear both;animation-timeline:view();animation-range:cover 20% cover 45%}
  .litBlue{animation:litBlue linear both;animation-timeline:view();animation-range:cover 20% cover 45%}
  .zoomSec{view-timeline-name:--zs}
  .zoomText{animation:zoomThrough linear both;animation-timeline:--zs;animation-range:contain 0% contain 70%}
  .zoomBehind{animation:behindIn linear both;animation-timeline:--zs;animation-range:contain 10% contain 80%}
  .line{animation:drawLine linear both;animation-timeline:view();animation-range:entry 20% cover 55%}
  .stepPop{animation:stepPop linear both;animation-timeline:view();animation-range:entry 10% cover 35%}
  .phoneSpin{animation:phoneSpin linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
  .circleOpen{animation:circleOpen linear both;animation-timeline:view();animation-range:entry 0% cover 50%}
}
@supports not (animation-timeline: view()){

  .zoomSec{height:auto !important}
  .zoomSticky{position:relative !important;height:auto !important;padding:120px 0}
  .zoomBehind{position:relative !important}
  .zoomText{display:none}
  .line{stroke-dashoffset:0}
  .lit{color:#EEF2F5}.litBlue{color:#8CCBF0}
}

/* Hero: Steak-Video rechts, Text links (Ränder per Verlauf statt Maske – Safari-sicher) */
.heroVidBox{position:absolute;top:50%;right:0;width:64%;aspect-ratio:16/9;transform:translateY(-44%)}

.navDesk{display:flex}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .loader{display:none !important}
}
