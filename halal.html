<style>
body{margin:0;background:#07090C}
a{color:#8CCBF0}a:hover{color:#BFE3F8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@keyframes word{0%{opacity:0;transform:translateY(70%) rotateX(-80deg)}100%{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fabIn{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:none}}
@keyframes fabPing{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}
@keyframes menuIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes stamp{0%{opacity:0;transform:scale(2.8) rotate(-28deg)}55%{opacity:1;transform:scale(.9) rotate(3deg)}72%{transform:scale(1.05) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
@keyframes shock{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
@keyframes ripple{0%{opacity:.45;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
@keyframes check{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.word{display:inline-block;transform-origin:50% 100%;animation:word 1s cubic-bezier(.16,1,.3,1) both}
.fadeUp{animation:fadeUp 1s cubic-bezier(.16,1,.3,1) both}
.stamp{animation:stamp .9s cubic-bezier(.2,.9,.3,1.2) .6s both}
.shock{animation:shock 1s cubic-bezier(.16,1,.3,1) both}
.ripple{animation:ripple 3s ease-out infinite}
.shake{animation:shake .5s ease-out 1.1s both}
.check{stroke-dasharray:60;animation:check .6s cubic-bezier(.65,0,.35,1) 1.5s both}
.ringText{animation:fadeIn 1s ease 1.7s both}
.ringSpin{animation:spin 24s linear infinite}
@supports (animation-timeline: view()){
  .reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
  .pop{animation:popIn linear both;animation-timeline:view();animation-range:entry 10% cover 30%}
  .progress{animation:grow linear both;animation-timeline:scroll(root)}
}
@supports not (animation-timeline: view()){ .progress{display:none} }
.fab{animation:fabIn .8s cubic-bezier(.16,1,.3,1) .8s both;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.fab:hover{transform:scale(1.08)}
.fabPing{animation:fabPing 2.4s ease-out 1.6s infinite}
.menuIn{animation:menuIn .35s cubic-bezier(.16,1,.3,1) both}
.cta{transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s}
.cta:hover{transform:scale(1.05);box-shadow:0 0 50px rgba(140,203,240,.5)}
.navlink{color:#A7AFB8;text-decoration:none;transition:color .2s}
.navlink:hover{color:#EEF2F5}
.card{transition:transform .5s cubic-bezier(.16,1,.3,1),border-color .5s}
.card:hover{transform:perspective(900px) rotateX(5deg) rotateY(-5deg) translateY(-8px);border-color:rgba(140,203,240,.5)}
.ph{background-color:#0F141A;background-image:repeating-linear-gradient(135deg,rgba(140,203,240,.05) 0 2px,transparent 2px 18px)}
.navDesk{display:flex}
.navMob{display:none}
@media (max-width: 1080px){ .navDesk{display:none} .navMob{display:flex} }
@media (max-width: 480px){ .hideSm{display:none} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important;transition:none !important} }
</style>
<noscript><style>#root{display:none}</style></noscript>
</head>

<template id="dc-tpl">

<div lang="{{lang}}" style="min-height: 100vh; background: #07090C; color: #EEF2F5; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip">

  <div class="progress" aria-hidden="true" style="position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 61; transform-origin: left; background: #8CCBF0; box-shadow: 0 0 14px #8CCBF0"></div>

  <!-- ===== MENÜLEISTE ===== -->

        <span style="display: flex; align-items: baseline; gap: 7px; white-space: nowrap"><span style="font-size: 19px; font-weight: 900; letter-spacing: -0.02em; color: #8CCBF0">TDB Food</span><span class="hideSm" style="font-size: 15px; font-weight: 600; color: #8E969F">| Meat &amp; More</span></span>
      </a>
      <div class="navDesk" style="gap: 26px; font-size: 14px; font-weight: 500; align-items: center">
        <sc-for list="{{navItems}}" as="n" hint-placeholder-count="6">
          <a class="navlink" href="{{n.href}}" aria-current="{{n.cur}}" style="{{n.style}}">{{n.label}}</a>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="position: relative">
          <button type="button" onClick="{{toggleLang}}" aria-expanded="{{langOpenAttr}}" aria-label="{{t.langLabel}}" style="min-height: 44px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #EEF2F5; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>
            {{langCode}}
          </button>
          <sc-if value="{{langOpen}}" hint-placeholder-val="{{false}}">
            <div class="menuIn" style="position: absolute; right: 0; top: 52px; min-width: 170px; padding: 6px; border-radius: 18px; background: #11161C; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column">
              <sc-for list="{{langs}}" as="l" hint-placeholder-count="4">
                <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.current}}" style="{{l.style}}">{{l.label}}</button>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <a class="cta navDesk" href="kontakt.html" style="align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #8CCBF0; color: #07090C; font-size: 14px; font-weight: 700; text-decoration: none">{{t.navCta}}</a>
        <button class="navMob" type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuOpenAttr}}" aria-label="{{t.menu}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #EEF2F5; cursor: pointer; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </button>
      </div>
    </nav>
    <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
      <div class="menuIn" style="border-top: 1px solid rgba(255,255,255,0.08); padding: 12px 20px 24px; display: flex; flex-direction: column; background: rgba(7,9,12,0.96)">
        <sc-for list="{{navItems}}" as="n" hint-placeholder-count="6">
          <a href="{{n.href}}" onClick="{{closeMenu}}" style="{{n.mobStyle}}">{{n.label}}</a>
        </sc-for>
        <a class="cta" href="kontakt.html" style="margin-top: 18px; display: inline-flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #8CCBF0; color: #07090C; font-size: 17px; font-weight: 700; text-decoration: none">{{t.navCta}}</a>
      </div>
    </sc-if>
  </header>

  <!-- ===== SEITENKOPF MIT STEMPEL ===== -->
  <section style="position: relative; padding: 160px 24px 100px; overflow: hidden; background: #040507">

        <nav aria-label="Breadcrumb" class="fadeUp" style="display: flex; gap: 8px; font-size: 14px; color: #8E969F"><a class="navlink" href="index.html">{{t.navStart}}</a><span aria-hidden="true">/</span><span style="color: #EEF2F5">{{t.navHalal}}</span></nav>
        <h1 style="margin: 28px 0 0; font-size: clamp(52px, 8vw, 128px); line-height: 0.98; letter-spacing: -0.055em; font-weight: 900; perspective: 900px; padding-bottom: 0.06em">
          <span class="word" style="animation-delay: .1s">{{t.hA}}</span><br>

      </div>
      <div style="flex: 1 1 360px; display: flex; justify-content: center">
        <div class="shake" style="position: relative; width: min(440px, 82vw); aspect-ratio: 1 / 1">

          <div class="stamp" role="img" aria-label="{{t.stampAria}}" style="position: absolute; inset: 20%; border-radius: 50%; background: #8CCBF0; color: #07090C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 0 0 8px #040507, 0 0 0 10px #8CCBF0, 0 0 90px rgba(140,203,240,0.45)">
            <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#07090C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="check" d="M5 12.5l4.5 4.5L19 7.5"></path></svg>

            <span style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.22em">{{t.stampSub}}</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== WAS BEDEUTET DAS ===== -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 140px 24px 60px">
    <p class="reveal" style="margin: 0 0 14px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #8CCBF0">{{t.whatEyebrow}}</p>

        <div class="pop" style="display: inline-flex; align-items: center; gap: 14px; padding: 18px 26px 18px 18px; border-radius: 999px; background: #0D1116; border: 1px solid rgba(140,203,240,0.3); font-size: clamp(20px, 2.4vw, 30px); font-weight: 800; letter-spacing: -0.02em">
          <span style="width: 40px; height: 40px; border-radius: 50%; background: #8CCBF0; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#07090C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
          {{m}}
        </div>
      </sc-for>
    </div>
  </section>

  <!-- ===== ZERTIFIKAT ===== -->

    <div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: center; border-radius: 40px; background: #0D1116; border: 1px solid rgba(255,255,255,0.08); padding: clamp(28px, 5vw, 64px)">

        </div>
      </div>
    </div>

  <!-- ===== CTA ===== -->

  <a class="fab" href="https://wa.me/4917624115839" target="_blank" rel="noopener" aria-label="{{t.fab}}" style="position: fixed; right: 20px; bottom: 20px; z-index: 70; width: 64px; height: 64px; border-radius: 50%; background: #25D366; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 40px rgba(0,0,0,0.5)">

  </a>

  <!-- ===== FOOTER ===== -->
  <footer style="background: #040507; border-top: 1px solid rgba(255,255,255,0.07); padding: 80px 24px 32px">
    <div style="max-width: 1240px; margin: 0 auto">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 40px">
        <div style="display: flex; flex-direction: column; gap: 16px">
          <a href="index.html" aria-label="TDB Food | Meat &amp; More" style="display: block; width: 96px; height: 96px"><img src="assets/logo.svg" alt="TDB Food | Meat &amp; More" style="width: 96px; height: 96px; border-radius: 50%; display: block"></a>
          <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.01em"><span style="color: #8CCBF0">TDB Food</span> <span style="color: #8E969F">| Meat &amp; More</span></span>
