<style>
body{margin:0;background:#07090C}
a{color:#8CCBF0}a:hover{color:#BFE3F8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@keyframes word{0%{opacity:0;transform:translateY(70%) rotateX(-80deg)}100%{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fabIn{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:none}}
@keyframes fabPing{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}
@keyframes menuIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes ticker{0%,20%{transform:translateY(0)}25%,45%{transform:translateY(-25%)}50%,70%{transform:translateY(-50%)}75%,95%{transform:translateY(-75%)}100%{transform:translateY(0)}}
@keyframes imgIn{from{clip-path:inset(0 0 100% 0);transform:scale(1.15)}to{clip-path:inset(0 0 0 0);transform:none}}
@keyframes flip3d{from{transform:perspective(1200px) rotateX(55deg) translateY(100px);opacity:0}to{transform:none;opacity:1}}
.word{display:inline-block;transform-origin:50% 100%;animation:word 1s cubic-bezier(.16,1,.3,1) both}
.fadeUp{animation:fadeUp 1s cubic-bezier(.16,1,.3,1) both}
.ticker{animation:ticker 8s cubic-bezier(.77,0,.18,1) infinite}
@supports (animation-timeline: view()){
  .reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
  .imgIn{animation:imgIn linear both;animation-timeline:view();animation-range:entry 0% cover 40%}
  .flip3d{animation:flip3d linear both;animation-timeline:view();animation-range:entry 0% cover 35%}
  .progress{animation:grow linear both;animation-timeline:scroll(root)}
}
@supports not (animation-timeline: view()){ .progress{display:none} }
.fab{animation:fabIn .8s cubic-bezier(.16,1,.3,1) .8s both;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.fab:hover{transform:scale(1.08)}
.fabPing{animation:fabPing 2.4s ease-out 1.6s infinite}
.menuIn{animation:menuIn .35s cubic-bezier(.16,1,.3,1) both}
.cta{transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s}
.cta:hover{transform:scale(1.05);box-shadow:0 0 50px rgba(140,203,240,.5)}
.navlink{color:#A7AFB8;text-decoration:none;transition:color .2s}
.navlink:hover{color:#EEF2F5}
.card{transition:transform .5s cubic-bezier(.16,1,.3,1),border-color .5s}
.card:hover{transform:perspective(900px) rotateX(5deg) rotateY(-5deg) translateY(-8px);border-color:rgba(140,203,240,.5)}
.ph{background-color:#0F141A;background-image:repeating-linear-gradient(135deg,rgba(140,203,240,.05) 0 2px,transparent 2px 18px)}
.navDesk{display:flex}
.navMob{display:none}
@media (max-width: 1080px){ .navDesk{display:none} .navMob{display:flex} }
@media (max-width: 480px){ .hideSm{display:none} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important;transition:none !important} }
</style>
<noscript><style>#root{display:none}</style></noscript>

      t: t, lang: lang, langCode: t.code, navItems: navItems, langs: langs, footCats: t.cats,
      langOpen: this.state.langOpen, langOpenAttr: this.state.langOpen ? "true" : "false",
      menuOpen: this.state.menuOpen, menuOpenAttr: this.state.menuOpen ? "true" : "false",
      toggleLang: function () { self.setState({ langOpen: !self.state.langOpen }); },
      toggleMenu: function () { self.setState({ menuOpen: !self.state.menuOpen, langOpen: false }); },
      closeMenu: function () { self.setState({ menuOpen: false }); }
    };
  }
  renderVals() {
    var v = this.shell();
    var t = v.t;
    v.facts = t.facts.map(function (f) { return { v: f[0], l: f[1] }; });
    var placeImgs = ["assets/lager.jpg", "assets/kuehlfahrzeug.jpg"];
    v.places = t.places.map(function (p, i) { return { t: p[0], p: p[1], ph: p[2], img: placeImgs[i], noImg: !placeImgs[i], alt: p[0] + " – TDB Food | Meat & More" }; });
    v.logos = CUSTOMERS.map(function (c) { return { label: c.name, img: c.img, noImg: false }; });
    return v;
  }
}

DC.mount(Component);
</script>
