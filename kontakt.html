<head>

<style>
body{margin:0;background:#07090C}
a{color:#8CCBF0}a:hover{color:#BFE3F8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@keyframes word{0%{opacity:0;transform:translateY(70%) rotateX(-80deg)}100%{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fabIn{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:none}}
@keyframes fabPing{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}
@keyframes menuIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.word{display:inline-block;transform-origin:50% 100%;animation:word 1s cubic-bezier(.16,1,.3,1) both}
.fadeUp{animation:fadeUp 1s cubic-bezier(.16,1,.3,1) both}
@supports (animation-timeline: view()){
  .reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
  .progress{animation:grow linear both;animation-timeline:scroll(root)}
}
@supports not (animation-timeline: view()){ .progress{display:none} }
.fab{animation:fabIn .8s cubic-bezier(.16,1,.3,1) .8s both;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.fab:hover{transform:scale(1.08)}
.fabPing{animation:fabPing 2.4s ease-out 1.6s infinite}
.menuIn{animation:menuIn .35s cubic-bezier(.16,1,.3,1) both}
.cta{transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s}
.cta:hover{transform:scale(1.05);box-shadow:0 0 50px rgba(140,203,240,.5)}
.navlink{color:#A7AFB8;text-decoration:none;transition:color .2s}
.navlink:hover{color:#EEF2F5}
.ccard{transition:transform .4s cubic-bezier(.16,1,.3,1),border-color .4s,background .4s}
.ccard:hover{transform:translateY(-6px);border-color:rgba(140,203,240,.55);background:#10161D}
.field{transition:border-color .25s,box-shadow .25s}
.field:focus{outline:none;border-color:#8CCBF0;box-shadow:0 0 0 4px rgba(140,203,240,.18)}
.chip{transition:background .25s,color .25s,border-color .25s,transform .25s}
.chip:hover{transform:translateY(-2px)}
.faqBody{display:grid;transition:grid-template-rows .5s cubic-bezier(.16,1,.3,1),opacity .4s}
.faqIcon{transition:transform .4s cubic-bezier(.16,1,.3,1)}
.faqBtn:hover{color:#8CCBF0}
.igBtn{transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s}
.igBtn:hover{transform:scale(1.05);box-shadow:0 10px 50px rgba(214,41,118,.45)}
.navDesk{display:flex}
.navMob{display:none}
@media (max-width: 1080px){ .navDesk{display:none} .navMob{display:flex} }
@media (max-width: 480px){ .hideSm{display:none} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important;transition:none !important} }
</style>
<noscript><style>#root{display:none}</style></noscript>
</head>
<body>
<noscript><p style="font-family:system-ui;padding:24px;color:#EEF2F5;background:#07090C">Bitte JavaScript aktivieren. Kontakt: +49 176 24115839 · info@tdb-food.de · Marconistraße 34, 50769 Köln</p></noscript>
<template id="dc-tpl">

<div lang="{{lang}}" style="min-height: 100vh; background: #07090C; color: #EEF2F5; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip">

  <div class="progress" aria-hidden="true" style="position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 61; transform-origin: left; background: #8CCBF0; box-shadow: 0 0 14px #8CCBF0"></div>

  <!-- ===== MENÜLEISTE ===== -->
  <header style="position: fixed; top: 0; left: 0; right: 0; z-index: 60; backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); background: rgba(7,9,12,0.72); border-bottom: 1px solid rgba(255,255,255,0.06)">
    <nav aria-label="Hauptmenü" style="max-width: 1280px; margin: 0 auto; padding: 0 20px; min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a href="index.html" aria-label="TDB Food | Meat &amp; More" style="display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0">

        <span style="display: flex; align-items: baseline; gap: 7px; white-space: nowrap"><span style="font-size: 19px; font-weight: 900; letter-spacing: -0.02em; color: #8CCBF0">TDB Food</span><span class="hideSm" style="font-size: 15px; font-weight: 600; color: #8E969F">| Meat &amp; More</span></span>
      </a>
      <div class="navDesk" style="gap: 26px; font-size: 14px; font-weight: 500; align-items: center">
        <sc-for list="{{navItems}}" as="n" hint-placeholder-count="6">
          <a class="navlink" href="{{n.href}}" aria-current="{{n.cur}}" style="{{n.style}}">{{n.label}}</a>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="position: relative">
          <button type="button" onClick="{{toggleLang}}" aria-expanded="{{langOpenAttr}}" aria-label="{{t.langLabel}}" style="min-height: 44px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #EEF2F5; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>
            {{langCode}}
          </button>
          <sc-if value="{{langOpen}}" hint-placeholder-val="{{false}}">
            <div class="menuIn" style="position: absolute; right: 0; top: 52px; min-width: 170px; padding: 6px; border-radius: 18px; background: #11161C; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column">
              <sc-for list="{{langs}}" as="l" hint-placeholder-count="4">
                <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.current}}" style="{{l.style}}">{{l.label}}</button>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <a class="cta navDesk" href="#formular" style="align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #8CCBF0; color: #07090C; font-size: 14px; font-weight: 700; text-decoration: none">{{t.navCta}}</a>
        <button class="navMob" type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuOpenAttr}}" aria-label="{{t.menu}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #EEF2F5; cursor: pointer; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </button>
      </div>
    </nav>
    <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
      <div class="menuIn" style="border-top: 1px solid rgba(255,255,255,0.08); padding: 12px 20px 24px; display: flex; flex-direction: column; background: rgba(7,9,12,0.96)">
        <sc-for list="{{navItems}}" as="n" hint-placeholder-count="6">
          <a href="{{n.href}}" onClick="{{closeMenu}}" style="{{n.mobStyle}}">{{n.label}}</a>
        </sc-for>
      </div>
    </sc-if>
  </header>

  <!-- ===== SEITENKOPF ===== -->
  <section style="position: relative; padding: 170px 24px 50px; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; left: 50%; top: 30%; width: 1100px; height: 1100px; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(circle, rgba(140,203,240,0.12) 0%, rgba(7,9,12,0) 62%)"></div>
    <div style="position: relative; max-width: 1240px; margin: 0 auto">
      <nav aria-label="Breadcrumb" class="fadeUp" style="display: flex; gap: 8px; font-size: 14px; color: #8E969F"><a class="navlink" href="index.html">{{t.navStart}}</a><span aria-hidden="true">/</span><span style="color: #EEF2F5">{{t.navContact}}</span></nav>
      <h1 style="margin: 28px 0 0; font-size: clamp(52px, 9vw, 140px); line-height: 0.98; letter-spacing: -0.055em; font-weight: 900; perspective: 900px; padding-bottom: 0.06em">
        <span class="word" style="animation-delay: .1s">{{t.hA}}</span><br>
        <span class="word" style="animation-delay: .25s; color: #8CCBF0">{{t.hB}}</span>
      </h1>
      <p class="fadeUp" style="margin: 26px 0 0; max-width: 640px; font-size: clamp(18px, 2vw, 22px); line-height: 1.5; color: #A7AFB8; animation-delay: .45s">{{t.hSub}}</p>
    </div>
  </section>

  <!-- ===== KONTAKTWEGE ===== -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 30px 24px 90px">
    <div class="fadeUp" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; animation-delay: .6s">
      <a class="ccard" href="https://wa.me/4917624115839" target="_blank" rel="noopener" style="display: flex; flex-direction: column; gap: 18px; padding: 28px; border-radius: 28px; background: #0D1116; border: 1px solid rgba(255,255,255,0.08); color: #EEF2F5; text-decoration: none">
        <span style="width: 52px; height: 52px; border-radius: 14px; background: #25D366; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52s.198-.298.298-.497c.099-.198.05-.371-.025-.52s-.669-1.612-.916-2.207c-.242-.579-.487-.5-.669-.51a13 13 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074s2.096 3.2 5.077 4.487c.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413s.248-1.289.173-1.413c-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.82 9.82 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.82 11.82 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.9 11.9 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.82 11.82 0 0 0-3.48-8.413"></path></svg></span>
        <span><span style="display: block; font-size: 22px; font-weight: 800">WhatsApp</span><span style="display: block; margin-top: 6px; font-size: 15px; color: #A7AFB8">{{t.waP}}</span></span>
      </a>
      <a class="ccard" href="tel:+4917624115839" style="display: flex; flex-direction: column; gap: 18px; padding: 28px; border-radius: 28px; background: #0D1116; border: 1px solid rgba(255,255,255,0.08); color: #EEF2F5; text-decoration: none">
        <span style="width: 52px; height: 52px; border-radius: 14px; border: 2px solid #8CCBF0; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8CCBF0" stroke-width="1.8" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"></path></svg></span>
        <span><span style="display: block; font-size: 22px; font-weight: 800">{{t.telT}}</span><span style="display: block; margin-top: 6px; font-size: 15px; color: #A7AFB8">+49 176 24115839</span></span>
      </a>
      <a class="ccard" href="mailto:info@tdb-food.de" style="display: flex; flex-direction: column; gap: 18px; padding: 28px; border-radius: 28px; background: #0D1116; border: 1px solid rgba(255,255,255,0.08); color: #EEF2F5; text-decoration: none">
        <span style="width: 52px; height: 52px; border-radius: 14px; border: 2px solid #8CCBF0; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8CCBF0" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></span>
        <span><span style="display: block; font-size: 22px; font-weight: 800">{{t.mailT}}</span><span style="display: block; margin-top: 6px; font-size: 15px; color: #A7AFB8">info@tdb-food.de</span></span>
      </a>

        <span style="width: 52px; height: 52px; border-radius: 14px; border: 2px solid #8CCBF0; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8CCBF0" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg></span>
        <span><span style="display: block; font-size: 22px; font-weight: 800">{{t.addrT}}</span><span style="display: block; margin-top: 6px; font-size: 15px; color: #A7AFB8">Marconistraße 34, 50769 Köln</span><span style="display: block; margin-top: 8px; font-size: 14px; font-weight: 700; color: #8CCBF0">{{t.route}} →</span></span>
      </a>
    </div>
  </section>

  <!-- ===== FORMULAR ===== -->
  <section id="formular" style="padding: 120px 24px; background: #8CCBF0; color: #07090C; scroll-margin-top: 40px">
    <div style="max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 56px; align-items: start">
      <div class="reveal">
        <p style="margin: 0 0 14px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #1E3A4D">{{t.formEyebrow}}</p>
        <h2 style="margin: 0; font-size: clamp(44px, 6vw, 88px); line-height: 0.95; letter-spacing: -0.055em; font-weight: 900; padding-bottom: 0.06em">{{t.formA}}</h2>
        <p style="margin: 24px 0 0; max-width: 440px; font-size: 19px; line-height: 1.55; color: #1E3A4D">{{t.formP}}</p>
      </div>
      <div style="background: #07090C; color: #EEF2F5; border-radius: 32px; padding: 36px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="k-name" style="font-size: 14px; font-weight: 600; color: #A7AFB8">{{t.fName}}</label>
          <input id="k-name" class="field" type="text" autocomplete="name" value="{{fName}}" onInput="{{setName}}" style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: #10151B; color: #EEF2F5; font: inherit; font-size: 17px">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="k-firma" style="font-size: 14px; font-weight: 600; color: #A7AFB8">{{t.fFirma}}</label>
          <input id="k-firma" class="field" type="text" autocomplete="organization" value="{{fFirma}}" onInput="{{setFirma}}" style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: #10151B; color: #EEF2F5; font: inherit; font-size: 17px">
        </div>
        <fieldset style="margin: 0; padding: 0; border: 0">
          <legend style="padding: 0; margin-bottom: 10px; font-size: 14px; font-weight: 600; color: #A7AFB8">{{t.fInterest}}</legend>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
              <button class="chip" type="button" onClick="{{c.toggle}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.name}}</button>
            </sc-for>
          </div>
        </fieldset>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="k-msg" style="font-size: 14px; font-weight: 600; color: #A7AFB8">{{t.fMsg}}</label>
          <textarea id="k-msg" class="field" rows="4" value="{{fMsg}}" onInput="{{setMsg}}" style="padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: #10151B; color: #EEF2F5; font: inherit; font-size: 17px; resize: vertical"></textarea>
        </div>
        <a class="cta" href="{{waLink}}" target="_blank" rel="noopener" style="margin-top: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; border-radius: 999px; background: #8CCBF0; color: #07090C; font-size: 18px; font-weight: 800; text-decoration: none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.4 7.9L3 21l1.2-4.4A9 9 0 1 1 21 12z"></path></svg>
          {{t.send}}
        </a>
      </div>
    </div>
  </section>

  <!-- ===== FAQ ===== -->
  <section id="faq" style="max-width: 900px; margin: 0 auto; padding: 140px 24px 100px; scroll-margin-top: 40px">
    <h2 class="reveal" style="margin: 0 0 40px; font-size: clamp(40px, 6vw, 80px); line-height: 1.05; letter-spacing: -0.05em; font-weight: 900; padding-bottom: 0.12em">{{t.faqA}}</h2>
    <div style="border-top: 1px solid rgba(255,255,255,0.1)">
      <sc-for list="{{faqs}}" as="q" hint-placeholder-count="7">
        <div style="border-bottom: 1px solid rgba(255,255,255,0.1)">
          <button class="faqBtn" type="button" onClick="{{q.toggle}}" aria-expanded="{{q.expanded}}" style="width: 100%; min-height: 76px; padding: 20px 0; display: flex; align-items: center; justify-content: space-between; gap: 20px; background: transparent; border: 0; color: #EEF2F5; font: inherit; font-size: clamp(19px, 2vw, 24px); font-weight: 700; letter-spacing: -0.02em; text-align: left; cursor: pointer">
            {{q.q}}
            <svg class="faqIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8CCBF0" stroke-width="2" aria-hidden="true" style="{{q.iconStyle}}"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
          <div class="faqBody" style="{{q.bodyStyle}}">
            <div style="overflow: hidden">
              <p style="margin: 0; padding: 0 0 26px; max-width: 700px; font-size: 18px; line-height: 1.6; color: #A7AFB8">{{q.a}}</p>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- ===== INSTAGRAM ===== -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 0 24px 140px">
    <div class="reveal" style="border-radius: 36px; background: #0D1116; border: 1px solid rgba(255,255,255,0.08); padding: clamp(28px, 5vw, 56px); display: flex; flex-wrap: wrap; gap: 28px; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 20px">
        <svg width="64" height="64" viewBox="0 0 56 56" aria-hidden="true"><defs><radialGradient id="igK" cx="0.3" cy="1.07" r="1.2"><stop offset="0" stop-color="#FDF497"></stop><stop offset="0.08" stop-color="#FDF497"></stop><stop offset="0.45" stop-color="#FD5949"></stop><stop offset="0.6" stop-color="#D6249F"></stop><stop offset="0.9" stop-color="#285AEB"></stop></radialGradient></defs><rect width="56" height="56" rx="15" fill="url(#igK)"></rect><rect x="12" y="12" width="32" height="32" rx="9.5" fill="none" stroke="#fff" stroke-width="3.6"></rect><circle cx="28" cy="28" r="7.6" fill="none" stroke="#fff" stroke-width="3.6"></circle><circle cx="37.4" cy="18.6" r="2.3" fill="#fff"></circle></svg>
