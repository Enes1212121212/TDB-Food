<style>
body{margin:0;background:#07090C}
a{color:#8CCBF0}a:hover{color:#BFE3F8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@keyframes word{0%{opacity:0;transform:translateY(70%) rotateX(-80deg)}100%{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fabIn{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:none}}
@keyframes fabPing{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}
@keyframes menuIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes cityPing{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes truck{0%{transform:translateX(-140px)}100%{transform:translateX(calc(100vw + 140px))}}
@keyframes drawLine{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes stepPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.word{display:inline-block;transform-origin:50% 100%;animation:word 1s cubic-bezier(.16,1,.3,1) both}
.fadeUp{animation:fadeUp 1s cubic-bezier(.16,1,.3,1) both}
.draw{stroke-dasharray:700;animation:draw 1s cubic-bezier(.65,0,.35,1) both}
.cityPing{transform-box:fill-box;transform-origin:center;animation:cityPing 2.4s ease-out infinite}
.popIn{transform-box:fill-box;transform-origin:center;animation:popIn .5s cubic-bezier(.2,.9,.3,1.3) both}
.ping{animation:ping 2s ease-out infinite}
.truck{animation:truck 9s linear infinite}
.line{stroke-dasharray:1000}
@supports (animation-timeline: view()){
  .reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
  .chipIn{animation:popIn linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
  .line{animation:drawLine linear both;animation-timeline:view();animation-range:entry 20% cover 55%}
  .stepPop{animation:stepPop linear both;animation-timeline:view();animation-range:entry 10% cover 35%}
  .progress{animation:grow linear both;animation-timeline:scroll(root)}
}
@supports not (animation-timeline: view()){ .progress{display:none} .line{stroke-dashoffset:0} }
.fab{animation:fabIn .8s cubic-bezier(.16,1,.3,1) .8s both;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.fab:hover{transform:scale(1.08)}
.fabPing{animation:fabPing 2.4s ease-out 1.6s infinite}
.menuIn{animation:menuIn .35s cubic-bezier(.16,1,.3,1) both}
.cta{transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s}
.cta:hover{transform:scale(1.05);box-shadow:0 0 50px rgba(140,203,240,.5)}
.navlink{color:#A7AFB8;text-decoration:none;transition:color .2s}
.navlink:hover{color:#EEF2F5}
.ph{background-color:#0F141A;background-image:repeating-linear-gradient(135deg,rgba(140,203,240,.05) 0 2px,transparent 2px 18px)}
.navDesk{display:flex}
.navMob{display:none}
@media (max-width: 1080px){ .navDesk{display:none} .navMob{display:flex} }
@media (max-width: 480px){ .hideSm{display:none} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important;transition:none !important} }
</style>
<noscript><style>#root{display:none}</style></noscript>
</head>

<template id="dc-tpl">

<div lang="{{lang}}" style="min-height: 100vh; background: #07090C; color: #EEF2F5; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip">

              <sc-for list="{{langs}}" as="l" hint-placeholder-count="4">
                <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.current}}" style="{{l.style}}">{{l.label}}</button>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <a class="cta navDesk" href="kontakt.html" style="align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #8CCBF0; color: #07090C; font-size: 14px; font-weight: 700; text-decoration: none">{{t.navCta}}</a>
        <button class="navMob" type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuOpenAttr}}" aria-label="{{t.menu}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #EEF2F5; cursor: pointer; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </button>
      </div>
    </nav>
    <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">

        <a class="cta" href="kontakt.html" style="margin-top: 18px; display: inline-flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #8CCBF0; color: #07090C; font-size: 17px; font-weight: 700; text-decoration: none">{{t.navCta}}</a>
      </div>
    </sc-if>
  </header>

  <!-- ===== SEITENKOPF ===== -->
  <section style="position: relative; padding: 170px 24px 40px; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; left: 50%; top: 30%; width: 1100px; height: 1100px; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(circle, rgba(140,203,240,0.12) 0%, rgba(7,9,12,0) 62%)"></div>

  <!-- ===== STÄDTE ===== -->

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">

        <div class="chipIn" style="{{c.style}}">
          <span style="position: relative; width: 12px; height: 12px; flex-shrink: 0">
            <sc-if value="{{c.hub}}" hint-placeholder-val="{{false}}"><span class="ping" style="position: absolute; inset: 0; border-radius: 50%; background: #07090C"></span></sc-if>
            <span style="{{c.dot}}"></span>

            <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">{{c.name}}</span>
            <span style="{{c.noteStyle}}">{{c.note}}</span>
          </span>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- ===== ABLAUF ===== -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 60px 24px 60px">
    <p class="reveal" style="margin: 0 0 14px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #8CCBF0">{{t.stepsEyebrow}}</p>
    <h2 class="reveal" style="margin: 0; font-size: clamp(44px, 6.5vw, 96px); line-height: 1; letter-spacing: -0.05em; font-weight: 900; padding-bottom: 0.08em">{{t.stepsA}}<br><span style="color: #8E969F">{{t.stepsB}}</span></h2>
    <div style="position: relative; margin-top: 72px">
      <svg viewBox="0 0 1000 40" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 8%; top: 38px; width: 84%; height: 40px; overflow: visible">
        <path class="line" d="M0 20 C 160 -10, 340 50, 500 20 S 840 -10, 1000 20" fill="none" stroke="#8CCBF0" stroke-width="2" stroke-dasharray="1000" vector-effect="non-scaling-stroke"></path>
      </svg>
      <div style="position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 40px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px">
            <div class="stepPop" style="{{s.circle}}">
              <span style="{{s.numStyle}}">{{s.num}}</span>
            </div>
            <h3 style="margin: 0; font-size: 28px; letter-spacing: -0.03em">{{s.t}}</h3>
            <p style="margin: 0; max-width: 300px; color: #A7AFB8; font-size: 17px; line-height: 1.5">{{s.p}}</p>

        </sc-for>

        style: "min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; text-align: left; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; background: " + (on ? "rgba(140,203,240,0.16)" : "transparent") + "; color: " + (on ? "#8CCBF0" : "#EEF2F5"),
        footStyle: "min-width: 44px; min-height: 44px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; color: " + (on ? "#8CCBF0" : "#8E969F")
      };
    });
    return {
      t: t, lang: lang, langCode: t.code, navItems: navItems, langs: langs, footCats: t.cats,
      langOpen: this.state.langOpen, langOpenAttr: this.state.langOpen ? "true" : "false",
      menuOpen: this.state.menuOpen, menuOpenAttr: this.state.menuOpen ? "true" : "false",
      toggleLang: function () { self.setState({ langOpen: !self.state.langOpen }); },
      toggleMenu: function () { self.setState({ menuOpen: !self.state.menuOpen, langOpen: false }); },
      closeMenu: function () { self.setState({ menuOpen: false }); }
    };
  }
  renderVals() {
    var self = this;
    var v = this.shell();
    var t = v.t;
    v.areaRef = function (el) { self.areaEl = el; };
    v.mapOn = this.state.mapOn;
    v.count = this.state.count;
    v.cities = CITIES.map(function (name, i) {
      var hub = i === 0;
      return {
        name: name, hub: hub, note: hub ? t.hubNote : t.cityNote,
        style: "display: flex; align-items: center; gap: 16px; padding: 22px 24px; border-radius: 24px; " + (hub ? "background: #8CCBF0; color: #07090C;" : "background: #0D1116; border: 1px solid rgba(255,255,255,0.08);"),
        dot: "position: absolute; inset: 0; border-radius: 50%; background: " + (hub ? "#07090C" : "#8CCBF0"),
        noteStyle: "font-size: 14px; color: " + (hub ? "#1E3A4D" : "#A7AFB8")
      };
    });
    v.steps = t.steps.map(function (s, i) {
      var last = i === 2;
      return {
        t: s[0], p: s[1], num: "0" + (i + 1),
        circle: "width: 112px; height: 112px; border-radius: 50%; display: flex; align-items: center; justify-content: center; " + (last ? "background: #8CCBF0; box-shadow: 0 0 60px rgba(140,203,240,0.45);" : "background: #07090C; border: 2px solid #8CCBF0; box-shadow: 0 0 50px rgba(140,203,240,0.25);"),
        numStyle: "font-size: 34px; font-weight: 900; letter-spacing: -0.03em; color: " + (last ? "#07090C" : "#8CCBF0")
      };
    });
    return v;
  }
}

DC.mount(Component);
</script>
